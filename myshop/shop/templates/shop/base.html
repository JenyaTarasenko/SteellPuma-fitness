{% load static %}
<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{{ seo_title|default:"Сталева пума" }}{% endblock %}</title>

    <!-- Open Graph -->
    <meta property="og:title" content="{{ seo_title|default:'Доставка Пиццы и Суши в Днепре' }}">
    <meta property="og:description"
        content="{{ seo_description|default:'Доставка Пиццы и Суши в Днепре. Закажите онлайн с быстрой доставкой за 40 минут!' }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    {% if seo_image %}
    <meta property="og:image"
        content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{{ seo_image }}{% endblock %}">
    {% endif %}
    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "{{ seo_title|default:'Мій магазин'|escapejs }}",
        "description": "{{ seo_description|default:'Доставка піци та суші в Дніпрі. Замовте онлайн.'|escapejs }}",
        "url": "{{ canonical_url|default:request.build_absolute_uri }}"{% if seo_image %},
        "image": "{{ request.scheme }}://{{ request.get_host }}{{ seo_image }}"{% endif %},
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "Dnipro",
            "addressCountry": "Ukraine"
        },
        "openingHours": "Mo-Su 10:00-21:00",
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+380 (99) 016 00 02",
            "contactType": "Customer Service"
        }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Marck+Script&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.jsAlpine.js — “легкий Vue для маленьких интерактивных частей сайта” меню выпадающие списки -->
    <script src="//unpkg.com/alpinejs" defer></script>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Подключаем кастомные шрифты через Tailwind config inline -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        manrope: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>

</head>
<!-- цвет всего текста бэкграунд -->

<body class="bg-[#000000]">
    <!-- меню ВСЕГДА будет -->
    {% comment %} {% include 'include/menu.html' %} {% endcomment %}
    {% block content %}
    {% endblock %}

    <script>
    document.querySelectorAll('.video-box').forEach((box) => {

        const video = box.querySelector('.video');
        const button = box.querySelector('.play-btn');

        let isPlaying = false;

        button.addEventListener('click', () => {

            if (!isPlaying) {
                video.play();
                button.style.display = 'none';
                isPlaying = true;
            } else {
                video.pause();
                button.style.display = 'flex';
                isPlaying = false;
            }

        });

        video.addEventListener('click', () => {

            if (!isPlaying) {
                video.play();
                button.style.display = 'none';
                isPlaying = true;
            } else {
                video.pause();
                button.style.display = 'flex';
                isPlaying = false;
            }

        });

        video.addEventListener('ended', () => {
            isPlaying = false;
            button.style.display = 'flex';
        });

    });
    </script>
     <!-- подключение видео galery.hrml -->
</body>

</html>
